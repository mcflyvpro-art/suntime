<style>
:root{
  --bg:#0b0c0e;--fg:#ecebe8;--fg2:#a9adb3;--mut:#6c7178;--line:#1d1f23;--line2:#2a2d32;
  --sun:#ffa93a;--sun2:#f2762e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow-x:hidden
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{
  max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 14px)
}
header{display:flex;align-items:center;justify-content:space-between;height:48px}
#place{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:600;letter-spacing:-.01em;padding:8px 0;max-width:80%}
#place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#place .chev{color:var(--mut);flex:none}
#place .pin{color:var(--sun);flex:none;display:none}
#place.gps .pin{display:block}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg2);flex:none}
.ib:active{background:var(--line)}
#today{opacity:0;pointer-events:none;transition:opacity .2s;color:var(--sun)}
#today.on{opacity:1;pointer-events:auto}

#sky{flex:1;min-height:210px;position:relative;margin:4px -20px 0;touch-action:pan-y}
#sky svg,#year svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}

.times{display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
.t{display:flex;flex-direction:column;gap:2px}
.t.r{align-items:flex-end;text-align:right}
.t .k{color:var(--mut);height:20px;display:flex;align-items:center}
.t .v{font-size:52px;font-weight:250;letter-spacing:-.035em;line-height:1;color:var(--fg2);transition:color .2s}
.t.next .v{color:var(--fg)}
.t.next .k{color:var(--sun)}
.t .s{font-size:13px;color:var(--sun);height:18px;margin-top:6px;letter-spacing:.01em}

.date{display:flex;align-items:center;justify-content:space-between;margin-top:22px;height:44px}
#dlabel{font-size:15px;font-weight:500;color:var(--fg2);display:flex;align-items:center;gap:8px;padding:10px 12px}
#dlabel i{width:6px;height:6px;border-radius:50%;background:var(--sun);display:none}
#dlabel.now i{display:block}
#dlabel.now{color:var(--fg)}

#year{position:relative;height:104px;margin-top:6px;touch-action:none;cursor:ew-resize}

/* sheet */
#sheet{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;visibility:hidden}
#sheet.on{visibility:visible}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
#sheet.on .scrim{opacity:1}
.panel{
  position:relative;max-width:460px;width:100%;margin:0 auto;height:82vh;height:82dvh;background:#141518;
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)
}
#sheet.on .panel{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 6px}
.srow{display:flex;gap:8px;padding:8px 16px 12px;align-items:center}
.field{flex:1;display:flex;align-items:center;gap:8px;background:#1d1f23;border-radius:12px;padding:0 12px;height:44px;color:var(--mut)}
#q{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;min-width:0}
#q::placeholder{color:var(--mut)}
#q::-webkit-search-cancel-button{display:none}
#gps{background:#1d1f23;width:44px;height:44px;color:var(--sun)}
#gps.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#list{list-style:none;overflow-y:auto;flex:1;padding:0 8px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#list li{font-variant-numeric:normal;display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:50px;border-radius:12px;font-size:16px;cursor:pointer}
#list li:active{background:var(--line)}
#list li small{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:10px}
#list li.sel{color:var(--sun)}
#list li svg{display:none}
#list li.sel svg{display:block}
</style>
</head>

      <div class="v" id="set">--:--</div>

    </div>
  </div>

  <div class="date">
    <button class="ib" id="prev" aria-label="Jour précédent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button id="dlabel"><i></i><span id="dtext"></span></button>
    <button class="ib" id="next" aria-label="Jour suivant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <div id="year"><svg id="yearsvg"></svg></div>
</div>

<div id="sheet">

  <div class="panel">
    <div class="grab"></div>
    <div class="srow">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Ville" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </label>
      <button id="gps" class="ib" aria-label="Ma position">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <ul id="list"></ul>
  </div>
</div>

const DEFAULT = {n:"Lyon",lat:45.764,lon:4.836};
const TZ = 'Europe/Paris';
const $ = s => document.getElementById(s);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- Soleil (algorithme type SunCalc / NOAA) ---------- */
const PI = Math.PI, rad = PI/180, DAY = 864e5, J1970 = 2440588, J2000 = 2451545, E = rad*23.4397, J0 = 0.0009;
const toDays = ms => ms/DAY - 0.5 + J1970 - J2000;
const fromJ = j => (j + 0.5 - J1970) * DAY;
const meanAnom = d => rad*(357.5291 + 0.98560028*d);
const eclLon = M => M + rad*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M)) + rad*102.9372 + PI;
const decl = L => Math.asin(Math.sin(E)*Math.sin(L));
const rAsc = L => Math.atan2(Math.sin(L)*Math.cos(E), Math.cos(L));

function altitude(ms, lat, lon){
  const d = toDays(ms), L = eclLon(meanAnom(d)), dec = decl(L);
  const H = rad*(280.16 + 360.9856235*d) + rad*lon - rAsc(L), phi = rad*lat;
  return Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H)) / rad;
}
function sunTimes(ms, lat, lon, h = -0.833){
  const lw = -rad*lon, phi = rad*lat, d = toDays(ms);
  const n = Math.round(d - J0 - lw/(2*PI));
  const ds = J0 + lw/(2*PI) + n;
  const M = meanAnom(ds), L = eclLon(M), dec = decl(L);
  const corr = 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const Jnoon = J2000 + ds + corr;
  const c = (Math.sin(h*rad) - Math.sin(phi)*Math.sin(dec)) / (Math.cos(phi)*Math.cos(dec));
  if (c < -1 || c > 1) return {noon: fromJ(Jnoon)};
  const Jset = J2000 + J0 + (Math.acos(c) + lw)/(2*PI) + n + corr;
  return {noon: fromJ(Jnoon), rise: fromJ(2*Jnoon - Jset), set: fromJ(Jset)};
}

/* ---------- Heure de Paris ---------- */
const DTF = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
function parts(ms){
  const o = {}; for (const p of DTF.formatToParts(new Date(ms))) o[p.type] = p.value;
  return {y:+o.year, m:+o.month, d:+o.day, h:+o.hour % 24, mi:+o.minute, s:+o.second};
}
function offset(ms){ const p = parts(ms); return Date.UTC(p.y,p.m-1,p.d,p.h,p.mi,p.s) - Math.floor(ms/1000)*1000; }
function paris(y,m,d,h=0,mi=0){ const g = Date.UTC(y,m-1,d,h,mi); let t = g - offset(g); return g - offset(t); }
const hours = ms => { const p = parts(ms); return p.h + p.mi/60 + p.s/3600; };
const pad = n => String(n).padStart(2,'0');
const hm = ms => { const p = parts(ms + 30000); return pad(p.h) + ':' + pad(p.mi); };
const today = () => { const p = parts(Date.now()); return {y:p.y,m:p.m,d:p.d}; };
const addDays = (D,n) => { const t = new Date(Date.UTC(D.y,D.m-1,D.d+n)); return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()}; };
const same = (a,b) => a.y===b.y && a.m===b.m && a.d===b.d;
const DFMT = new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'});
const DFMTY = new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dur = ms => { const m = Math.round(ms/6e4); return Math.floor(m/60) + ' h ' + pad(m%60); };
const rel = ms => { const m = Math.round(ms/6e4); return m < 60 ? 'dans ' + m + ' min' : 'dans ' + Math.floor(m/60) + ' h ' + pad(m%60); };

/* ---------- État ---------- */
const store = {
  get(){ try { const v = JSON.parse(localStorage.getItem('soleil.place')); if (v && isFinite(v.lat) && isFinite(v.lon)) return v; } catch(e){} return null; },
  set(v){ try { localStorage.setItem('soleil.place', JSON.stringify(v)); } catch(e){} }
};
const S = {place: store.get() || DEFAULT, date: today()};

/* ---------- SVG helpers ---------- */
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- Courbe du jour ---------- */
function drawSky(t, isToday, now, len, delta){
  const svg = $('skysvg'), box = $('sky').getBoundingClientRect();
  const W = box.width, H = box.height; if (!W || !H) return;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.textContent = '';
  const P = S.place, {y,m,d} = S.date;
  const padX = 20, padT = 18, padB = 26, y0 = padT + (H - padT - padB) * 0.5, A = 72;
  const X = h => padX + h/24 * (W - 2*padX);
  const Y = a => y0 - a/A * (y0 - padT);

  const N = 144, pts = [];
  for (let k = 0; k <= N; k++){ const ms = paris(y,m,d,0,k*10); pts.push([X(k/N*24), Y(altitude(ms,P.lat,P.lon))]); }
  const line = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');

  const defs = el('defs',{},svg);
  const g = el('linearGradient',{id:'gd',x1:0,y1:0,x2:0,y2:1},defs);
  el('stop',{offset:0,'stop-color':css('--sun'),'stop-opacity':.42},g);
  el('stop',{offset:1,'stop-color':css('--sun2'),'stop-opacity':.04},g);
  const glow = el('radialGradient',{id:'gl'},defs);
  el('stop',{offset:0,'stop-color':css('--sun'),'stop-opacity':.55},glow);
  el('stop',{offset:1,'stop-color':css('--sun'),'stop-opacity':0},glow);
  el('rect',{x:0,y:0,width:W,height:y0},el('clipPath',{id:'up'},defs));
  el('rect',{x:0,y:y0,width:W,height:H},el('clipPath',{id:'dn'},defs));

  // grille horaire
  for (const h of [6,12,18]){
    el('line',{x1:X(h),x2:X(h),y1:padT,y2:H-padB+4,stroke:css('--line'),'stroke-width':1},svg);
    const tx = el('text',{x:X(h),y:H-6,'text-anchor':'middle','font-size':11,fill:css('--mut'),'letter-spacing':'.04em'},svg);
    tx.textContent = pad(h);
  }
  // aire de jour
  el('path',{d:`M${pts[0][0]},${y0}L` + pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L') + `L${pts[N][0]},${y0}Z`,fill:'url(#gd)','clip-path':'url(#up)'},svg);
  // horizon
  el('line',{x1:0,x2:W,y1:y0,y2:y0,stroke:css('--line2'),'stroke-width':1},svg);
  // courbe
  el('path',{d:line,fill:'none',stroke:css('--line2'),'stroke-width':1.5,'stroke-dasharray':'2 4','stroke-linecap':'round','clip-path':'url(#dn)'},svg);
  el('path',{d:line,fill:'none',stroke:css('--sun'),'stroke-width':2,'stroke-linejoin':'round','clip-path':'url(#up)'},svg);

  // lever / coucher
  if (t.rise) for (const ms of [t.rise, t.set])
    el('circle',{cx:X(hours(ms)),cy:y0,r:4,fill:css('--bg'),stroke:css('--sun'),'stroke-width':2},svg);

  // durée du jour
  if (t.rise){
    const cy = y0 + (H - padB - y0) * 0.5;
    const a = el('text',{x:W/2,y:cy,'text-anchor':'middle','font-size':22,'font-weight':400,fill:css('--fg'),'letter-spacing':'-.01em'},svg);
    a.textContent = dur(len);
    const s = Math.round(delta/1000), sign = s > 0 ? '+' : s < 0 ? '−' : '±';
    const b = el('text',{x:W/2,y:cy+20,'text-anchor':'middle','font-size':12,fill:css('--mut')},svg);
    b.textContent = Math.abs(s) >= 60 ? `${sign}${Math.round(Math.abs(s)/60)} min` : `${sign}${Math.abs(s)} s`;
  }

  // maintenant
  if (isToday){
    const x = X(hours(now)), alt = altitude(now,P.lat,P.lon), yy = Y(alt), up = alt > -0.833;
    el('line',{x1:x,x2:x,y1:padT-8,y2:H-padB+4,stroke:css('--fg'),'stroke-opacity':.14,'stroke-width':1},svg);
    if (up){
      el('circle',{cx:x,cy:yy,r:26,fill:'url(#gl)'},svg);
      el('circle',{cx:x,cy:yy,r:7,fill:css('--sun')},svg);
    } else {
      el('circle',{cx:x,cy:yy,r:6,fill:css('--bg'),stroke:css('--fg2'),'stroke-width':1.5},svg);
    }
  }
}

/* ---------- Année ---------- */
let yearCache = null;
function yearData(){
  const P = S.place, y = S.date.y, key = y + '|' + P.lat + '|' + P.lon;
  if (yearCache && yearCache.key === key) return yearCache;
  const days = [];
  for (let i = 0; ; i++){
    const D = addDays({y, m:1, d:1}, i); if (D.y !== y) break;
    const t = sunTimes(paris(D.y,D.m,D.d,12), P.lat, P.lon);
    days.push({D, r: hours(t.rise), s: hours(t.set)});
  }
  return yearCache = {key, days};
}
const doy = D => Math.round((Date.UTC(D.y,D.m-1,D.d) - Date.UTC(D.y,0,1)) / DAY);

function drawYear(){
  const svg = $('yearsvg'), box = $('year').getBoundingClientRect();
  const W = box.width, H = box.height; if (!W || !H) return;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.textContent = '';
  const {days} = yearData(), n = days.length;
  const top = 4, bot = H - 20;
  const X = i => i/(n-1) * W, Y = h => top + h/24 * (bot - top);

  el('rect',{x:0,y:top,width:W,height:bot-top,rx:8,fill:'#111214'},svg);
  // mois
  const L = 'JFMAMJJASOND';
  for (let mo = 0; mo < 12; mo++){
    const i0 = doy({y:S.date.y,m:mo+1,d:1});
    if (mo) el('line',{x1:X(i0),x2:X(i0),y1:top,y2:bot,stroke:css('--bg'),'stroke-width':1.5},svg);
    const i1 = mo < 11 ? doy({y:S.date.y,m:mo+2,d:1}) : n;
    const tx = el('text',{x:(X(i0)+X(i1-1))/2,y:H-4,'text-anchor':'middle','font-size':10,fill:css('--mut')},svg);
    tx.textContent = L[mo];
  }
  // bande de jour
  let d = 'M' + days.map((o,i) => X(i).toFixed(1)+','+Y(o.r).toFixed(1)).join('L');
  d += 'L' + days.map((o,i) => X(i).toFixed(1)+','+Y(o.s).toFixed(1)).reverse().join('L') + 'Z';
  const defs = el('defs',{},svg);
  const g = el('linearGradient',{id:'yg',x1:0,y1:0,x2:0,y2:1},defs);
  el('stop',{offset:0,'stop-color':css('--sun'),'stop-opacity':.30},g);
  el('stop',{offset:.5,'stop-color':css('--sun'),'stop-opacity':.16},g);
  el('stop',{offset:1,'stop-color':css('--sun2'),'stop-opacity':.30},g);
  el('path',{d,fill:'url(#yg)'},svg);
  for (const k of ['r','s'])
    el('path',{d:'M'+days.map((o,i)=>X(i).toFixed(1)+','+Y(o[k]).toFixed(1)).join('L'),fill:'none',stroke:css('--sun'),'stroke-width':1.25,'stroke-opacity':.8},svg);

  // aujourd'hui
  const T = today();
  if (T.y === S.date.y){ const xi = X(doy(T)); el('path',{d:`M${xi-4},${bot+6}h8l-4,-5z`,fill:css('--sun')},svg); }
  // sélection
  const si = doy(S.date), xs = X(si), o = days[si];
  el('line',{x1:xs,x2:xs,y1:top,y2:bot,stroke:css('--fg'),'stroke-opacity':.55,'stroke-width':1.25},svg);
  for (const h of [o.r, o.s]) el('circle',{cx:xs,cy:Y(h),r:3.5,fill:css('--fg')},svg);
}

/* ---------- Rendu ---------- */
function render(){
  const P = S.place, D = S.date, now = Date.now(), T = today(), isToday = same(D,T);
  const t = sunTimes(paris(D.y,D.m,D.d,12), P.lat, P.lon);
  const pD = addDays(D,-1), tp = sunTimes(paris(pD.y,pD.m,pD.d,12), P.lat, P.lon);
  const len = t.set - t.rise, delta = len - (tp.set - tp.rise);

  $('pname').textContent = P.n;
  $('place').classList.toggle('gps', !!P.gps);
  $('rise').textContent = hm(t.rise);
  $('set').textContent = hm(t.set);

  const next = !isToday ? null : now < t.rise ? 'r' : now < t.set ? 's' : null;
  $('tr').classList.toggle('next', !isToday || next === 'r');
  $('ts').classList.toggle('next', !isToday || next === 's');
  $('rrel').textContent = next === 'r' ? rel(t.rise - now) : '';
  $('srel').textContent = next === 's' ? rel(t.set - now) : '';

  const dms = Date.UTC(D.y,D.m-1,D.d,12);
  let lbl = D.y === T.y ? DFMT.format(dms) : DFMTY.format(dms);
  $('dtext').textContent = lbl.charAt(0).toUpperCase() + lbl.slice(1);
  $('dlabel').classList.toggle('now', isToday);
  $('today').classList.toggle('on', !isToday);

  drawSky(t, isToday, now, len, delta);
  drawYear();
}
const go = n => { S.date = addDays(S.date, n); render(); };

/* ---------- Interactions ---------- */
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('dlabel').onclick = $('today').onclick = () => { S.date = today(); render(); };

// balayage horizontal sur la courbe
(() => {
  let x0 = null, y0 = 0;
  const sky = $('sky');
  sky.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  sky.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

// glisser sur l'année
(() => {
  const yr = $('year'); let drag = false;
  const pick = e => {
    const b = yr.getBoundingClientRect(), n = yearData().days.length;
    const i = Math.max(0, Math.min(n-1, Math.round((e.clientX - b.left) / b.width * (n-1))));
    const D = addDays({y:S.date.y,m:1,d:1}, i);
    if (!same(D, S.date)){ S.date = D; render(); }
  };
  yr.addEventListener('pointerdown', e => { drag = true; yr.setPointerCapture(e.pointerId); pick(e); });
  yr.addEventListener('pointermove', e => { if (drag) pick(e); });
  const up = () => { drag = false; };
  yr.addEventListener('pointerup', up); yr.addEventListener('pointercancel', up);
})();

// clavier (desktop)
addEventListener('keydown', e => {
  if ($('sheet').classList.contains('on')) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

/* ---------- Choix du lieu ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[-'’]/g,' ');
const CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
function fillList(){
  const q = norm($('q').value.trim()), ul = $('list');
  const list = CITIES.filter(c => !q || norm(c[0]).includes(q) || c[3].toLowerCase() === q)
    .sort((a,b) => q ? (norm(a[0]).startsWith(q) ? 0 : 1) - (norm(b[0]).startsWith(q) ? 0 : 1) || a[0].localeCompare(b[0],'fr') : a[0].localeCompare(b[0],'fr'));
  ul.innerHTML = list.map(c => {
    const sel = !S.place.gps && S.place.n === c[0];
    return `<li data-n="${c[0]}"${sel ? ' class="sel"' : ''}><span>${c[0]}</span><small>${c[3]}${CHECK}</small></li>`;
  }).join('');
}
function openSheet(){ $('q').value = ''; fillList(); $('sheet').classList.add('on'); $('list').scrollTop = 0; }
function closeSheet(){ $('sheet').classList.remove('on'); $('q').blur(); }
function setPlace(p){ S.place = p; store.set(p); yearCache = null; closeSheet(); render(); }

$('place').onclick = openSheet;
$('sheet').querySelector('.scrim').onclick = closeSheet;
$('q').addEventListener('input', fillList);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter'){ const li = $('list').firstElementChild; if (li) li.click(); } });
$('list').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const c = CITIES.find(c => c[0] === li.dataset.n);
  setPlace({n:c[0], lat:c[1], lon:c[2]});
});
// glisser la feuille vers le bas pour fermer
(() => {
  const panel = $('sheet').querySelector('.panel'); let y0 = null;
  panel.addEventListener('touchstart', e => { if ($('list').scrollTop <= 0) y0 = e.touches[0].clientY; else y0 = null; }, {passive:true});
  panel.addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }, {passive:true});
})();

$('gps').onclick = () => {
  if (!navigator.geolocation) return;
  const b = $('gps'); b.classList.add('busy');
  navigator.geolocation.getCurrentPosition(pos => {
    b.classList.remove('busy');
    const {latitude:lat, longitude:lon} = pos.coords;
    let best = CITIES[0], bd = Infinity;
    for (const c of CITIES){
      const dx = (c[2]-lon) * Math.cos(lat*rad), dy = c[1]-lat, dd = dx*dx + dy*dy;
      if (dd < bd){ bd = dd; best = c; }
    }
    setPlace({n:best[0], lat:+lat.toFixed(4), lon:+lon.toFixed(4), gps:true});
  }, () => b.classList.remove('busy'), {enableHighAccuracy:false, timeout:10000, maximumAge:6e5});
};

/* ---------- Boucle ---------- */
new ResizeObserver(() => render()).observe($('sky'));
let lastDay = today();
setInterval(() => {
  const T = today();
  if (!same(T, lastDay)){ if (same(S.date, lastDay)) S.date = T; lastDay = T; }
  if (same(S.date, T) && !document.hidden) render();
}, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ const T = today(); if (!same(T,lastDay)){ if (same(S.date,lastDay)) S.date = T; lastDay = T; } render(); } });
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
